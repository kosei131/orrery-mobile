name: ORRERY MT5 Offline Tests
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
permissions:
  contents: read
jobs:
  local-test-mode:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test offline HistData M1 import and timestamp handling
        run: python -m unittest -v test_histdata_m1_import.py test_m1_complete_bars.py test_histdata_pipeline.py test_merge_m1_months.py test_real_bars_lsr_bridge.py
      - name: Run no-MT5 safety and HTTP tests
        run: python -m unittest -v test_mt5_local_dashboard.py test_mt5_safety.py test_mt5_quotes.py test_mt5_charts.py
      - name: Verify FX storage safety and JavaScript syntax
        run: |
          node test_fx.cjs
          node test_mt5_poll.cjs
          node test_weekly_plan.cjs
      - name: Exercise pinned Windows launcher and hash rejection
        if: runner.os == 'Windows'
        run: python -m unittest -v test_windows_launcher.py

      - name: Test LSR-02 decision gates
        run: python -m unittest -v test_lsr02.py test_lsr02_structure.py test_lsr02_sequence.py test_lsr02_replay.py test_lsr02_paths.py test_lsr02_regime.py test_lsr02_regime_replay.py test_lsr02_halts.py test_lsr02_csv.py test_lsr02_mt5_bridge.py test_lsr02_risk_plan.py test_lsr02_exits.py test_lsr02_study.py test_lsr02_portfolio.py test_lsr02_context.py test_lsr02_pnl_preview.py test_lsr02_scalp_gate.py test_lsr02_decision_journal.py test_lsr02_market_review.py test_lsr02_level_observer.py test_lsr02_overlay_export.py test_lsr02_snapshot_overlay.py test_lsr02_basket_risk.py test_lsr02_equity_audit.py test_lsr02_trade_attribution.py test_lsr02_attribution_csv.py test_lsr02_deal_ledger.py test_lsr02_regime_diagnostics.py test_lsr02_seeded_replay.py test_lsr02_loss_stop.py test_lsr02_indicator_research.py test_lsr02_indicator_variants.py test_lsr02_multibar.py test_lsr02_variant_regression.py test_lsr03_vhf.py test_lsr03_adapter.py test_lsr03_candidate_report.py test_lsr03_unique_candidates.py test_lsr03_matched_outcomes.py test_lsr04_reversal.py test_lsr04_signal_journal.py test_lsr04_asof_join.py test_lsr04_signal_attribution.py test_lsr04_data_quality.py test_lsr04_mt5_ticks.py test_lsr04_mt5_capture.py test_lsr04_mt5_adaptive.py test_lsr04_tick_fills.py test_lsr04_broker_sizing.py test_lsr04_mt5_broker_quote.py test_lsr04_account_gate.py test_lsr04_mt5_account_sync.py test_lsr04_deal_groups.py test_lsr04_daily_reconciliation.py test_lsr04_mt5_position_risk.py test_lsr04_daily_halts.py test_lsr04_tick_quality.py test_lsr04_tick_archive.py test_lsr04_tick_catalog.py test_lsr03_tick_study.py test_lsr03_mt5_pilot.py test_lsr03_backtest_preflight.py test_lsr03_account_replay.py test_lsr03_account_study.py test_lsr03_account_carry.py
      - name: Compare deterministic synthetic indicator variants
        run: python lsr02_compare_variants.py

      - name: Compare LSR-02 and VHF synthetic candidates
        run: python lsr03_candidate_report.py

      - name: Verify synthetic LSR viewer
        run: |
          python build_lsr_view.py --check
          node test_lsr_view.cjs
          node test_lsr_chart_preview.cjs

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test driver
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check synthetic viewer in installed Chrome
        env:
          ORRERY_BROWSER_CHANNEL: chrome
        run: |
          node test_lsr_browser.cjs
          node test_mt5_chart_browser.cjs


  public-xau-m1-source-validation:
    name: Inspect free XAUUSD M1 public sample (no trading)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download public research sample once per run
        run: |
          curl --fail --location --silent --show-error --max-time 90 \
            --output xauusd_public_m1.csv \
            https://raw.githubusercontent.com/getdata-finance/xauusd-1m-ohlcv-metals-historical-data/main/XAUUSD_1m.csv
      - name: Verify raw CSV timestamps and OHLC
        run: python orrery_public_xau_m1_audit.py xauusd_public_m1.csv public_xau_audit.json
      - name: Verify explicit UTC and generate complete M5 M15 H4 research bars
        run: python orrery_public_xau_to_bars.py xauusd_public_m1.csv --out public_xau_bars
      - name: Count LSR-02 structure events on uninterrupted real XAU bars
        run: python orrery_public_xau_structure_report.py
      - name: Diagnose H4 session gaps without inventing market hours
        run: python orrery_public_xau_h4_gap_diagnostic.py
      - name: Count exploratory M15 sweep to M5 confirmation sequences
        run: python orrery_public_xau_sequence_study.py
      - name: Calculate explicitly hypothetical $3000 M1 candidate PnL
        run: python orrery_xau_hypothetical_pnl.py
      - name: Quantify nine XAUUSD spread-stop cost scenarios
        run: python orrery_xau_cost_sensitivity.py
      - name: Save checksum and coverage report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-public-m1-audit
          path: |
            public_xau_audit.json
            public_xau_bars/report.json
            public_xau_structure_report.json
            public_xau_h4_gap_report.json
            public_xau_sequence_report.json
            public_xau_hypothetical_pnl.json
            public_xau_cost_sensitivity.json
          if-no-files-found: warn
          retention-days: 7
