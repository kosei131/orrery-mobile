name: ORRERY MT5 Offline Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-test-mode:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run no-MT5 safety and HTTP tests
        run: python -m unittest -v test_mt5_local_dashboard.py test_mt5_safety.py
      - name: Verify FX storage safety and JavaScript syntax
        run: |
          node test_fx.cjs
          node test_weekly_plan.cjs
      - name: Exercise pinned Windows launcher and hash rejection
        if: runner.os == 'Windows'
        run: python -m unittest -v test_windows_launcher.py

      - name: Test LSR-02 decision gates
        run: python -m unittest -v test_lsr02.py test_lsr02_structure.py test_lsr02_sequence.py test_lsr02_replay.py test_lsr02_paths.py test_lsr02_regime.py test_lsr02_regime_replay.py

      - name: Verify synthetic LSR viewer
        run: |
          python build_lsr_view.py --check
          node test_lsr_view.cjs

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test driver
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Check synthetic viewer in installed Chrome
        env:
          ORRERY_BROWSER_CHANNEL: chrome
        run: node test_lsr_browser.cjs
