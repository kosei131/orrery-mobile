name: ORRERY MT5 Offline Tests
on:
  push:
    paths:
      - 'mt5_local_dashboard.py'
      - 'test_mt5_local_dashboard.py'
      - '.github/workflows/mt5-offline-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-test-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run no-MT5 tests
        run: python -m unittest -v test_mt5_local_dashboard.py
