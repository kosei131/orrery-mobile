<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORRERY FX · 検証結果</title>
<link rel="stylesheet" href="/viewer.css"><script src="/viewer.js" defer></script>
</head>
<body><main>
<header><p class="eyebrow">ORRERY FX · RESEARCH</p><h1>保存した検証結果</h1>
<p>DEMO限定・発注なし。現在のMT5仕様と明示した費用仮定による推計です。</p></header>
<section id="authPanel"><label for="key">専用閲覧鍵</label>
<input id="key" type="password" autocomplete="off" spellcheck="false" maxlength="128">
<p class="muted">鍵はこの画面のメモリーだけで使用します。再読込すると再入力が必要です。</p>
<button id="unlock" type="button">結果を表示</button></section>
<section aria-live="polite"><strong id="state">未認証</strong><p id="timing"></p>
<p class="muted">この画面は起動時に再監査した固定の保存結果です。workerの稼働状況・heartbeatは未接続です。</p>
<button id="refresh" type="button" disabled>保存結果を再表示</button>
<button id="logout" type="button" disabled>表示を閉じる</button></section>
<div id="result"></div>
<footer>短期間の研究結果です。利益優位性・6か月検証の完了・実ブローカーの歴史的条件を証明しません。
PC不在での定期実行やスマホ接続の導入状態を示す画面ではありません。</footer>
</main></body></html>
